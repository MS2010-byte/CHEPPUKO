<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHEPPUKO — Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;background:#f7f6fb;color:#171421;margin:0}header{background:#171421;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:35px auto;padding:0 4%}.card{background:#fff;border-radius:20px;padding:25px;box-shadow:0 12px 35px #0001}.input{width:100%;padding:12px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.pink{background:#ff4f81;color:#fff}.dark{background:#171421;color:#fff}.green{background:#16723b;color:#fff}.red{background:#b4233d;color:#fff}.filters{display:flex;gap:8px;margin:20px 0}.active{background:#171421;color:#fff}.hidden{display:none}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.badge{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}.pending{background:#fff5d8}.approved{background:#e9fff0}.rejected{background:#ffecef}.msg{margin-top:12px;padding:10px;border-radius:10px;background:#ffecef}</style></head><body><header><b>CHEPPUKO ♥ Admin</b><button class="btn" onclick="logout()">Logout</button></header><div class="wrap"><div id="login" class="card"><h2>Admin Login 🔐</h2><p>Use your Supabase Auth account. There is no hardcoded admin password.</p><form onsubmit="login(event)"><input id="email" class="input" type="email" placeholder="Email" required><input id="password" class="input" type="password" placeholder="Password" required><button class="btn pink">Login</button></form><div id="msg"></div></div><div id="app" class="card hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2>Listener Applications</h2><p>Pending: <b id="pendingCount">0</b> · All: <b id="allCount">0</b></p></div></div><div class="filters"><button id="pbtn" class="btn active" onclick="filter('pending')">Pending</button><button id="abtn" class="btn" onclick="filter('all')">All</button><button class="btn" onclick="load()">↻ Refresh</button></div><div id="table" class="table">Loading...</div></div></div><script>const URL='https://bxwphbduebesollgenyy.supabase.co',KEY='sb_publishable_aN0hbGLJIN5Qu4Tt8AKCqw_xsbrh03D';const sb=supabase.createClient(URL,KEY);let apps=[],mode='pending';function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function login(e){e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)return msg.innerHTML='<div class="msg">'+esc(error.message)+'</div>';await open()}async function open(){const{data:{user}}=await sb.auth.getUser();if(!user)return showLogin();const{data,isAdmin,error}=await sb.rpc('is_cheppuko_admin').then(r=>({data:r.data,isAdmin:r.data,error:r.error}));if(error||isAdmin!==true){await sb.auth.signOut();return msg.innerHTML='<div class="msg">Access denied. This account is not a CHEPPUKO admin.</div>'}login.classList.add('hidden');app.classList.remove('hidden');await load()}async function load(){const{data,error}=await sb.from('listener_applications').select('id,user_id,name,age,languages,availability,experience,reason,status,created_at').order('created_at',{ascending:false});if(error){table.textContent=error.message;return}apps=data||[];pendingCount.textContent=apps.filter(a=>a.status==='pending').length;allCount.textContent=apps.length;render()}function filter(m){mode=m;pbtn.classList.toggle('active',m==='pending');abtn.classList.toggle('active',m==='all');render()}function render(){let x=mode==='pending'?apps.filter(a=>a.status==='pending'):apps;if(!x.length){table.innerHTML='<p>No applications found.</p>';return}table.innerHTML='<table><tr><th>Applicant</th><th>Details</th><th>Experience</th><th>Reason</th><th>Status</th><th>Applied</th><th>Action</th></tr>'+x.map(a=>'<tr><td><b>'+esc(a.name)+'</b><br><small>'+esc(a.user_id)+'</small></td><td>Age: '+esc(a.age)+'<br>Languages: '+esc(a.languages)+'<br>Availability: '+esc(a.availability)+'</td><td>'+esc(a.experience||'—')+'</td><td>'+esc(a.reason)+'</td><td><span class="badge '+esc(a.status)+'">'+esc(a.status)+'</span></td><td>'+esc(a.created_at)+'</td><td>'+(a.status==='pending'?'<button class="btn green" onclick="status(\''+a.id+'\',\'approved\')">Approve</button> <button class="btn red" onclick="status(\''+a.id+'\',\'rejected\')">Reject</button>':'—')+'</td></tr>').join('')+'</table>'}async function status(id,s){if(!confirm('Confirm '+s+'?'))return;const{error}=await sb.from('listener_applications').update({status:s}).eq('id',id).eq('status','pending');if(error)alert(error.message);else load()}async function logout(){await sb.auth.signOut();showLogin()}function showLogin(){app.classList.add('hidden');login.classList.remove('hidden')}sb.auth.onAuthStateChange((_e,session)=>{if(session)open();else showLogin()});(async()=>{const{data:{session}}=await sb.auth.getSession();if(session)open()})();</script></body></html>
